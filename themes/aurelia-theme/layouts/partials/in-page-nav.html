<div class="hidden lg:block mb-8">
  <details open class="group rounded-lg bg-gray-50 dark:bg-gray-900 dark:ring-1 dark:ring-gray-800">
    <summary class="flex items-center justify-between cursor-pointer list-none p-4 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/60 transition-colors [&::-webkit-details-marker]:hidden">
      <h2 class="text-sm font-semibold text-gray-900 dark:text-gray-100">On this page</h2>
      <svg class="w-5 h-5 text-gray-500 transition-transform duration-200 group-open:rotate-180"
           fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </summary>

    <nav aria-label="Page Navigation" class="px-4 pb-4 max-h-[60vh] overflow-y-auto">
      {{ $headers := findRE "<h2.*?>(.|\n)*?</h2>" .Content }}
      <ul class="border-l-2 border-gray-200 dark:border-gray-800">
        {{ range $headers }}
          {{ $header := . | replaceRE "<h2.*?>" "" | replaceRE "</h2>" "" | string }}
          {{ $header := $header | htmlUnescape }}
          <li>
            <a href="#{{ $header | anchorize }}"
               class="block py-1 pl-3 -ml-0.5 border-l-2 border-transparent text-sm text-gray-600 dark:text-gray-400 hover:text-aurelia dark:hover:text-aurelia-light hover:border-aurelia transition-colors line-clamp-2">
              {{ $header | safeHTML }}
            </a>
          </li>
        {{ end }}
      </ul>
    </nav>
  </details>
</div>
