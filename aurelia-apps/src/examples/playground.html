<div class="pg pg-mode-${mode} ${dark ? 'is-dark' : ''} ${resizing ? 'is-resizing' : ''}" keydown.trigger="onKeydown($event)">
  <div class="pg-bar">
    <label class="pg-picker" if.bind="mode === 'page' && examples.length > 1">
      <span class="pg-visually-hidden">Example</span>
      <select change.trigger="loadExample($event.target.value)">
        <option if.bind="!example" value="" selected>Shared code</option>
        <option repeat.for="ex of examples" value.bind="ex.id" selected.bind="ex.id === exampleId">${ex.title}</option>
      </select>
    </label>

    <div class="pg-tabs" role="tablist" aria-label="Files">
      <div repeat.for="file of files" class="pg-tab ${file.name === activeFile ? 'is-active' : ''}">
        <input if.bind="renaming === file.name" ref="renameInput" class="pg-name-input" value.bind="renameValue"
          aria-label="New name for ${file.name}" spellcheck="false" autocomplete="off"
          keydown.trigger="onRenameKey($event)" blur.trigger="confirmRename()">
        <button else type="button" role="tab" class="pg-tab-name" aria-selected.bind="file.name === activeFile"
          title.bind="mode === 'page' ? 'Double-click to rename' : null"
          click.trigger="openFile(file.name)" dblclick.trigger="startRename(file.name)">${file.name}</button>
        <button type="button" class="pg-tab-close" if.bind="mode === 'page' && files.length > 1 && renaming !== file.name"
          aria-label="Delete ${file.name}" title="Delete file" click.trigger="removeFile(file.name, $event)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7" /></svg>
        </button>
      </div>
      <input if.bind="addingFile" ref="newFileInput" class="pg-name-input pg-new-file" value.bind="newFileName"
        placeholder="my-element.ts" aria-label="New file name" spellcheck="false" autocomplete="off"
        keydown.trigger="onNewFileKey($event)" blur.trigger="confirmAddFile()">
      <button type="button" class="pg-add" if.bind="mode === 'page' && !addingFile" title="Add file"
        aria-label="Add file" click.trigger="startAddFile()">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
      </button>
    </div>

    <div class="pg-actions">
      <button type="button" class="pg-btn" click.trigger="reset()" title="Discard your changes">Reset</button>
      <button type="button" class="pg-btn pg-btn-primary" if.bind="mode === 'page'" click.trigger="share()">${shareLabel}</button>
      <a class="pg-btn" if.bind="mode === 'embed'" href.bind="playgroundHref" target="_blank" rel="noopener">Open in playground</a>
    </div>
  </div>

  <p class="pg-file-error" if.bind="newFileError" role="status">${newFileError}</p>
  <p class="pg-about" if.bind="mode === 'page' && example && example.description">${example.description}</p>

  <div class="pg-body" ref="bodyEl" style="--pg-split: ${split}%">
    <div class="pg-editor" ref="editorHost"></div>

    <div class="pg-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize editor"
      aria-valuemin="25" aria-valuemax="75" aria-valuenow.bind="split" title="Drag to resize. Double-click to reset."
      pointerdown.trigger="startResize($event)" pointermove.trigger="onResize($event)"
      pointerup.trigger="endResize($event)" pointercancel.trigger="endResize($event)"
      dblclick.trigger="resetSplit()" keydown.trigger="onResizeKey($event)"></div>

    <div class="pg-output">
      <div class="pg-preview-bar">
        <span class="pg-label">Preview</span>
        <span class="pg-status pg-status-${status}" role="status">${statusText}</span>
        <span class="pg-version" if.bind="mode === 'page'">Aurelia ${version}</span>
        <button type="button" class="pg-icon-btn" click.trigger="togglePreviewTheme()"
          aria-label="${previewDark ? 'Show preview in light mode' : 'Show preview in dark mode'}"
          title="${previewDark ? 'Light preview' : 'Dark preview'}">
          <svg if.bind="previewDark" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1" />
          </svg>
          <svg else viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z" /></svg>
        </button>
        <button type="button" class="pg-icon-btn" click.trigger="rerun()" aria-label="Run again"
          title="Run again (${runShortcut})">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.5h-2.5" /></svg>
        </button>
      </div>

      <div class="pg-preview ${previewDark ? 'is-dark' : ''}" ref="previewHost">
        <p class="pg-loading" if.bind="!hasRun && !problem">Loading Aurelia ${version}</p>
        <div class="pg-problem" if.bind="problem" role="alert">
          <div class="pg-problem-head">
            <strong>${problem.title}</strong>
            <button type="button" class="pg-link-btn" click.trigger="dismissProblem()">Dismiss</button>
          </div>
          <pre>${problem.detail}</pre>
        </div>
      </div>

      <section class="pg-console ${consoleOpen ? 'is-open' : ''}" aria-label="Console">
        <div class="pg-console-bar">
          <button type="button" class="pg-console-toggle" aria-expanded.bind="consoleOpen" click.trigger="toggleConsole()">
            <span class="pg-caret" aria-hidden="true"></span>
            Console
            <span class="pg-count ${errorCount ? 'has-errors' : ''}" if.bind="logs.length">${logs.length}</span>
          </button>
          <span class="pg-hint" if.bind="mode === 'page'">${runShortcut} runs now</span>
          <button type="button" class="pg-link-btn" if.bind="consoleOpen && logs.length" click.trigger="clearLogs()">Clear</button>
        </div>
        <ol class="pg-logs" if.bind="consoleOpen" ref="logList">
          <li repeat.for="log of logs" class="pg-log pg-log-${log.level}">${log.text}</li>
          <li class="pg-log-empty" if.bind="!logs.length">Output from console.log appears here.</li>
        </ol>
      </section>
    </div>
  </div>
</div>
