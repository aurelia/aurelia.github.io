baseURL = "/"
languageCode = "en-us"
title = "Aurelia"
theme = "aurelia-theme"

[taxonomies]
  authors = "authors"
  tags = "tags"
  categories = "categories"
  showcase_categories = "showcase_categories"

[permalinks]
  showcase_categories = "/showcase/category/:slug"

[params]
  pathPrefix = ""
  googleSiteVerification = "wo1nOr13c8YOEXzHEolpRqcHna--I5kCo4rhxDquWo0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.extensions]
      linkify = true
  [markup.highlight]
    style = "monokai"

[services]
  [services.googleAnalytics]
    ID = "G-QKNNSP5EY7"
  [services.disqus]
    shortname = 'aurelia-2'

[outputs]
  home = ["HTML", "RSS", "JSON"]
